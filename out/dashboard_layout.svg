<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="640" fill="#f6f7f9"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Dashboard layout: where each piece goes</text>
<rect x="30" y="50" width="840" height="560" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="2"/>
<!-- 1 title/headline -->
<rect x="45" y="62" width="810" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<circle cx="70" cy="85" r="14" fill="#2563eb"/><text x="70" y="90" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">1</text>
<text x="450" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">HEADLINE sheet (full width, top)</text>
<text x="450" y="125" text-anchor="middle" font-size="28" font-weight="bold" fill="#1e3a8a">2,903,380</text>
<text x="450" y="144" text-anchor="middle" font-size="12" fill="#1e3a8a">UK higher education enrolments, 2023/24</text>
<!-- 2 selector -->
<rect x="45" y="164" width="400" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<circle cx="70" cy="186" r="14" fill="#d97706"/><text x="70" y="191" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">2</text>
<text x="250" y="191" text-anchor="middle" font-size="14" fill="#78350f">METRIC selector (dropdown), above the trend</text>
<!-- 3 trend -->
<rect x="45" y="216" width="400" height="300" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<circle cx="70" cy="240" r="14" fill="#16a34a"/><text x="70" y="245" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">3</text>
<text x="250" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">METRIC TREND sheet (left, tall)</text>
<polyline points="80,440 170,410 260,380 350,400 420,420" fill="none" stroke="#16a34a" stroke-width="3"/>
<text x="250" y="480" text-anchor="middle" font-size="12" fill="#14532d">line chart, 2019/20 to 2023/24, legend inside</text>
<!-- 4 nations -->
<rect x="455" y="164" width="400" height="352" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<circle cx="480" cy="188" r="14" fill="#db2777"/><text x="480" y="193" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">4</text>
<text x="660" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#831843">NATION COMPARISON sheet (right)</text>
<text x="660" y="218" text-anchor="middle" font-size="12" fill="#831843">title: Full-time share by nation, 2023/24</text>
<rect x="490" y="360" width="50" height="130" fill="#db2777" opacity=".7"/><rect x="555" y="372" width="50" height="118" fill="#db2777" opacity=".7"/>
<rect x="620" y="376" width="50" height="114" fill="#db2777" opacity=".7"/><rect x="685" y="364" width="50" height="126" fill="#db2777" opacity=".7"/><rect x="750" y="400" width="50" height="90" fill="#db2777" opacity=".7"/>
<!-- 5 footer -->
<rect x="45" y="526" width="810" height="70" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
<circle cx="70" cy="548" r="14" fill="#9333ea"/><text x="70" y="553" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">5</text>
<text x="450" y="552" text-anchor="middle" font-size="15" font-weight="bold" fill="#581c87">TEXT strip (full width, very bottom)</text>
<text x="450" y="576" text-anchor="middle" font-size="12" fill="#581c87">Every number comes from tables that passed 86 automated checks. Rounded to nearest 5. Source: HESA (CC BY 4.0).</text>
</svg>
